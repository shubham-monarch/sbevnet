# S3 configuration
s3_data_handler:
  base_dir: "data"

# image dimensions
image_w: 640
image_h: 480
max_disp: 64

# segmentation and heatmap parameters
n_classes_seg: 14
n_hmap: 256

# depth range (in meters)
xmin: 4.0
xmax: 9.0

# horizontal range (in meters)
ymin: -2.0
ymax: 3.0

# camera parameters
cx: 964.989
cy: 569.276
f: 1093.2768
tx: 0.12
camera_ext_x: 0.0
camera_ext_y: 0.0

# additional parameters for SBEVNet
do_ipm_rgb: true
do_ipm_feats: true
fixed_cam_confs: true

# dataset parameters
json_path: 'data/model-dataset/dataset.json'
color_map: 'configs/Mavis.yaml'
do_mask: false
do_top_seg: false
zero_mask: false

# evaluation specific parameters
checkpoint_path: 'checkpoints/best_val_model.pth'
batch_size: 1
predictions_dir: 'predictions'
gpu_id: 3

# flags loaded in evaluate.py
enable_GT: true
enable_IPM: true