# zed svo config
svo_file: "svo-eval/front_2024-02-13-09-52-14.svo"
sampling_freq: 5
frame_cnt: 10000
output_dir: "svo-eval/GT-aws"

# S3 configuration
s3_data_handler:
  s3_uri: ""
  base_dir: "svo-eval"
  required_keys:
    - "left.jpg"
    - "right.jpg"
  n_train: 0
  n_test: -1

# model dataset 
model_data_handler:
  base_dir: "svo-eval"
  labels_to_remove: [0]

# image dimensions
image_w: 640
image_h: 480
max_disp: 64

# segmentation and heatmap parameters
n_classes_seg: 14
n_hmap: 256

# depth range (in meters)
xmin: 2.0
xmax: 7.0

# horizontal range (in meters)
ymin: -2.0
ymax: 3.0

# camera parameters
cx: 964.989
cy: 569.276
f: 1093.2768
tx: 0.12
camera_ext_x: 0.0
camera_ext_y: 0.0

# additional parameters for SBEVNet
do_ipm_rgb: false
do_ipm_feats: false
fixed_cam_confs: true

# training parameters
batch_size: 4
num_epochs: 200
learning_rate: 0.0001

# dataset parameters
json_path: "svo-eval/model-dataset/dataset.json"
color_map: "configs/Mavis.yaml"
do_mask: false
do_top_seg: true
zero_mask: false

# evaluation specific parameters
checkpoint_path: "checkpoints/best_val_model.pth"
batch_size: 1
do_top_seg: false
predictions_dir: "svo-eval/predictions"
gpu_id: 3 